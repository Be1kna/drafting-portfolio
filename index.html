<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drafting Hub</title>
  <link rel="stylesheet" href="https://be1kna.github.io/my_assets/global.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a href="../index.html" class="back-to-menu-btn">← Back</a>
      <div class="title">
        <h1>Drafting Hub</h1>
        <p class="subtitle">Project cards with slideshow previews</p>
      </div>
      <div class="actions">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <main>
      <section id="projectsGrid" class="projects-grid">Loading projects…</section>
    </main>

    <footer class="site-footer">Open slideshows inline or in a new tab. PDF is recommended for best browser support.</footer>
  </div>

  <div id="slideshowModal" class="modal" aria-hidden="true">
    <div id="slideshowBackdrop" class="modal-backdrop"></div>
    <button id="slideshowClose" class="modal-close" aria-label="Close">✕</button>
    <div class="modal-content slideshow-mode">
      <div id="pdfViewer" class="pdf-viewer" hidden>
        <div class="pdf-controls">
          <button id="prevPage" type="button">Previous</button>
          <span id="pageNum">Page: 1 / 1</span>
          <button id="nextPage" type="button">Next</button>
        </div>
        <canvas id="pdfCanvas"></canvas>
      </div>
      <iframe id="slideshowFrame" title="Slideshow preview" src="" loading="lazy"></iframe>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
